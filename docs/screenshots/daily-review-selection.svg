<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Daily Note Review — choose a daily review</title>
  <desc id="desc">Illustrative preview of the review picker shown over an Obsidian note.</desc>
  <rect width="1200" height="675" fill="#f5f5f5"/>
  <rect x="0" y="0" width="1200" height="40" fill="#ececec"/>
  <rect x="0" y="40" width="48" height="635" fill="#f0f0f0"/>
  <rect x="48" y="40" width="250" height="635" fill="#fafafa"/>
  <rect x="950" y="40" width="250" height="635" fill="#fafafa"/>
  <path d="M48 40v635M298 40v635M950 40v635" stroke="#ddd"/>
  <g fill="#777" font-family="Arial, sans-serif" font-size="15">
    <text x="23" y="26">◉</text><text x="85" y="26">⌕</text><text x="156" y="26">Old notes</text><text x="475" y="26">Daily Note Review</text>
    <text x="70" y="77">Search notes</text><text x="69" y="119">Daily</text><text x="69" y="154">Old notes</text><text x="69" y="190">New notes</text>
    <text x="974" y="79">Properties</text><text x="974" y="112">tags</text><text x="974" y="148">+ Add property</text>
  </g>
  <text x="343" y="166" fill="#252525" font-family="Arial, sans-serif" font-size="30" font-weight="700">Old notes</text>
  <text x="343" y="220" fill="#555" font-family="Arial, sans-serif" font-size="17">A note from your vault, ready for a quick review.</text>
  <text x="343" y="250" fill="#555" font-family="Arial, sans-serif" font-size="17">Review it, then choose an action to sort it for later.</text>
  <rect x="350" y="278" width="570" height="1" fill="#ddd"/>
  <rect x="352" y="297" width="128" height="36" rx="6" fill="#e8e8e8"/><text x="368" y="321" fill="#333" font-family="Arial, sans-serif" font-size="14">Move to review</text>
  <rect x="490" y="297" width="115" height="36" rx="6" fill="#e8e8e8"/><text x="505" y="321" fill="#333" font-family="Arial, sans-serif" font-size="14">Add #reviewed</text>
  <rect x="614" y="297" width="148" height="36" rx="6" fill="#e8e8e8"/><text x="630" y="321" fill="#333" font-family="Arial, sans-serif" font-size="14">Open in background</text>
  <rect x="0" y="0" width="1200" height="675" fill="#fff" opacity=".15"/>
  <rect x="356" y="236" width="488" height="202" rx="18" fill="#000" opacity=".14" transform="translate(0 7)"/>
  <rect x="356" y="236" width="488" height="202" rx="18" fill="#fff" stroke="#e5e5e5"/>
  <text x="380" y="271" fill="#222" font-family="Arial, sans-serif" font-size="18" font-weight="700">Choose a daily review</text>
  <text x="813" y="270" fill="#888" font-family="Arial, sans-serif" font-size="18">×</text>
  <rect x="379" y="289" width="442" height="47" rx="9" fill="#e8e8e8"/>
  <text x="396" y="318" fill="#222" font-family="Arial, sans-serif" font-size="15" font-weight="700">Old notes</text>
  <text x="722" y="318" fill="#555" font-family="Arial, sans-serif" font-size="14">0 notes to review</text>
  <rect x="379" y="346" width="442" height="47" rx="9" fill="#e8e8e8"/>
  <text x="396" y="375" fill="#222" font-family="Arial, sans-serif" font-size="15" font-weight="700">New notes</text>
  <text x="715" y="375" fill="#555" font-family="Arial, sans-serif" font-size="14">1 note to review</text>
  <text x="356" y="474" fill="#777" font-family="Arial, sans-serif" font-size="12">Illustrative interface preview</text>
</svg>
